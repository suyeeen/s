version: '3.8'
services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stqm-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - stqm-network
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: stqm-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-stqm_db}
      MYSQL_USER: ${DB_USERNAME:-stqm_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-StqmPass123!}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-StqmPass123!}
    volumes:
      - mysqldata:/var/lib/mysql
    networks:
      - stqm-network

  nginx:
    image: nginx:alpine
    container_name: stqm-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - stqm-network
    depends_on:
      - app

  prometheus:
    image: prom/prometheus:latest
    container_name: stqm-prometheus
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheusdata:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    networks:
      - stqm