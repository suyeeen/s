version: '3.8'

services:

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stqm-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - stqm-network

  nginx:
    image: nginx:alpine
    container_name: stqm-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - stqm-network
    depends_on:
      - app

  prometheus:
    image: prom/prometheus:latest
    container_name: stqm-prometheus
    restart: unless-stopped
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheusdata:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    networks:
      - stqm-network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: stqm-node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - stqm-network

  loki:
    image: grafana/loki:latest
    container_name: stqm-loki
    restart: unless-stopped
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/local-config.yaml
      - lokidata:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - stqm-network

  promtail:
    image: grafana/promtail:latest
    container_name: stqm-promtail
    restart: unless-stopped
    volumes:
      - ./storage/logs:/var/log/laravel:ro
      - ./docker/loki/promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - stqm-network
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: stqm-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafanadata:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - stqm-network
    depends_on:
      - prometheus
      - loki

volumes:
  prometheusdata:
  grafanadata:
  lokidata:
    driver: local

networks:
  stqm-network:
    driver: bridge