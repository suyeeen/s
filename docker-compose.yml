version: '3.8'

services:
  app:
    image: ghcr.io/suyeeen/stqm-app:${IMAGE_TAG:-latest}
    container_name: stqm-app
    restart: unless-stopped
    working_dir: /var/www
    # [MODIFIKASI] Auto-rotate log agar hardisk VPS tidak penuh (ENOSPC)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
      - ./docker/php/zzz-status.conf:/usr/local/etc/php-fpm.d/zzz-status.conf
      - ./.env:/var/www/.env
      - ./storage:/var/www/storage
    networks:
      - stqm-network
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: stqm-db
    restart: unless-stopped
    # [MODIFIKASI] Batasi ukuran log database
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-stqm_db}
      MYSQL_USER: ${DB_USERNAME:-stqm_user}
      # Kata sandi diganti 'secret' agar tidak ditegur GitGuardian
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - mysqldata:/var/lib/mysql
    networks:
      - stqm-network

  nginx:
    image: nginx:alpine
    container_name: stqm-nginx
    restart: unless-stopped
    # [MODIFIKASI] Batasi ukuran log web server
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./storage:/var/www/storage:ro
      # [CATATAN PENTING - JEBAKAN BATMAN]
      # Volume ini yang memaksa NGINX membaca dari hardisk VPS (bukan dari dalam image Laravel).
      # Konfigurasi ini dibiarkan seperti ini karena di file CI/CD kita sudah menambahkan
      # perintah `docker cp stqm-app:/var/www/public/build ./public/` untuk menyuntikkan file CSS/JS.
      - ./public:/var/www/public:ro
    networks:
      - stqm-network
    depends_on:
      - app

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: stqm-nginx-exporter
    restart: unless-stopped
    command:
      - -nginx.scrape-uri=http://nginx:80/nginx_status
    networks:
      - stqm-network
    depends_on:
      - nginx

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.14.0
    container_name: stqm-mysqld-exporter
    restart: unless-stopped
    environment:
      # Kata sandi diganti 'secret' agar tidak ditegur GitGuardian
      - DATA_SOURCE_NAME=root:${DB_PASSWORD:-secret}@(db:3306)/
    networks:
      - stqm-network
    depends_on:
      - db

  php-fpm-exporter:
    image: hipages/php-fpm_exporter:latest
    container_name: stqm-php-fpm-exporter
    restart: unless-stopped
    environment:
      - PHP_FPM_SCRAPE_URI=tcp://app:9000/status
      - PHP_FPM_FIX_PROCESS_COUNT=true
    networks:
      - stqm-network
    depends_on:
      - app

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: stqm-cadvisor
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    ports:
      - "8081:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - stqm-network

  prometheus:
    image: prom/prometheus:latest
    container_name: stqm-prometheus
    restart: unless-stopped
    ports:
      - "8888:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheusdata:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    networks:
      - stqm-network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: stqm-node-exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - stqm-network

  loki:
    image: grafana/loki:latest
    container_name: stqm-loki
    restart: unless-stopped
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/local-config.yaml
      - lokidata:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - stqm-network

  promtail:
    image: grafana/promtail:latest
    container_name: stqm-promtail
    restart: unless-stopped
    volumes:
      - ./storage/logs:/var/log/laravel:ro
      - ./docker/loki/promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - stqm-network
    depends_on:
      - ioki

  grafana:
    image: grafana/grafana:latest
    container_name: stqm-grafana
    restart: unless-stopped
    ports:
      - "8082:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-secret}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://103.157.27.236:8082
    volumes:
      - grafanadata:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - stqm-network
    depends_on:
      - prometheus
      - loki

volumes:
  mysqldata:
  prometheusdata:
  grafanadata:
  lokidata:
    driver: local

networks:
  stqm-network:
    driver: bridge