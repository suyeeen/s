name: CI/CD Pipeline - STQM

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    # Menyiapkan database MySQL sementara khusus untuk testing
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: stqm_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      # Mengunduh kode dari GitHub menggunakan versi patch terbaru
      - name: Checkout code
        uses: actions/checkout@v4.1.7

      # Menginstall PHP versi 8.3 beserta extension yang dibutuhkan Laravel
      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, mbstring, zip, gd, bcmath, exif, pcntl
          coverage: xdebug

      # Menyimpan cache vendor menggunakan rilis patch terbaru
      - name: Cache Composer dependencies
        uses: actions/cache@v4.0.2
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      # Menyalin file konfigurasi contoh menjadi file konfigurasi aktif
      - name: Copy environment file
        run: cp .env.example .env

      # Menginstall semua library PHP yang dibutuhkan aplikasi
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # Membuat APP_KEY unik untuk enkripsi session dan data sensitif
      - name: Generate application key
        run: php artisan key:generate --ansi

      # Membuat semua tabel database di MySQL testing
      - name: Run database migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: stqm_testing
          DB_USERNAME: root
          DB_PASSWORD: secret
        run: php artisan migrate --force

      # Menjalankan semua unit test dan feature test, minimal coverage 50%
      - name: Run PHPUnit tests
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: stqm_testing
          DB_USERNAME: root
          DB_PASSWORD: secret
        run: php artisan test --coverage-text --min=50

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    # Hanya jalan setelah test berhasil
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.7

      # Memindai seluruh kode sumber mencari celah keamanan CRITICAL dan HIGH
      # exit-code 0 artinya pipeline tidak berhenti meskipun ada temuan
      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 0

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: security
    # Hanya build jika push ke branch main 
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.7

      # Membangun Docker image dari Dockerfile untuk memastikan image bisa dibuild
      - name: Build Docker image
        run: docker build -t stqm-app:latest .

      # Memindai Docker image yang sudah dibuild mencari celah keamanan CRITICAL
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: stqm-app:latest
          severity: CRITICAL
          exit-code: 0

      # Memverifikasi image berhasil dibuat dengan menampilkan daftar image
      - name: Verify image built
        run: docker images stqm-app

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [test, build]
    # Hanya deploy jika push langsung ke branch main, bukan pull request
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.7

      # Masuk ke server via SSH menggunakan versi v1.2.0 (Menghilangkan runtime warning)
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          command_timeout: 40m
          script: |
            cd /var/www/s

            # Mengambil kode terbaru dari GitHub ke server
            echo "Pull kode terbaru..."
            git pull origin main || { echo "Git pull gagal!"; exit 1; }

            # Restart container tanpa rebuild image
            # Build hanya kalau ada perubahan di Dockerfile
            echo "Restart container..."
            docker-compose down
            docker-compose up -d || {
              echo "Deploy gagal! Rolling back..."
              docker-compose down
              git reset --hard HEAD~1
              docker-compose up -d
              exit 1
            }
            # Menjalankan migrasi database terbaru
            # Menyimpan konfigurasi ke cache supaya lebih cepat
            # Menyimpan routes ke cache supaya lebih cepat
            # Menyimpan compiled views ke cache supaya lebih cepat
            # Membuat symlink storage supaya file bisa diakses publik
            echo "Migrate dan cache..."
            docker-compose exec -T app php artisan migrate --force
            docker-compose exec -T app php artisan config:cache
            docker-compose exec -T app php artisan route:cache
            docker-compose exec -T app php artisan view:cache
            docker-compose exec -T app php artisan storage:link
            docker-compose exec -T -u root app chown -R www-data:www-data /var/www/storage /var/www/bootstrap/cache
            echo "Deploy selesai: $(date)"

  healthcheck:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      # Menunggu 15 detik supaya aplikasi sempat start setelah container restart
      - name: Wait for app to start
        run: sleep 15

      # Mengecek apakah aplikasi merespons dengan HTTP 200 atau 302
      # Jika tidak, pipeline dianggap gagal
      - name: Check HTTP response
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.VPS_HOST }}:8080)
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "302" ]; then
            echo "Health check gagal! Status: $STATUS"
            exit 1
          fi
          echo "App sehat! Status: $STATUS"

      # Memverifikasi semua container berjalan normal di server menggunakan v1.2.0
      - name: Check container status
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            docker-compose -f /var/www/s/docker-compose.yml ps
            echo "Container status checked"