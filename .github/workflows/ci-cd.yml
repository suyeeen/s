name: Enterprise CI/CD Pipeline - STQM

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  test:
    name: Code Logic Testing
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: stqm_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    steps:
      - name: The machine downloads the latest source code from the repository.
        uses: actions/checkout@v4

      - name: The system sets up the PHP environment with necessary extensions.
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, mbstring, zip, gd, bcmath, exif, pcntl
          coverage: xdebug

      - name: The system retrieves cached library files to accelerate the installation.
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: The system installs third-party dependencies using the MySQL service.
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist --optimize-autoloader
          php artisan key:generate --ansi

      - name: The system executes database migrations and unit tests against the MySQL service.
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: stqm_testing
          DB_USERNAME: root
          DB_PASSWORD: secret
        run: |
          php artisan migrate --force
          php artisan test --coverage-text --min=50

  security:
    name: Security Vulnerability Scanning
    runs-on: ubuntu-latest
    steps:
      - name: The machine retrieves the unverified source code simultaneously.
        uses: actions/checkout@v4

      - name: The Trivy scanner inspects the codebase for exposed secrets and critical vulnerabilities.
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 0

  build:
    name: Phase 2 - Docker Image Building
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: The machine retrieves the security-verified codebase.
        uses: actions/checkout@v4

      - name: The system authenticates with the GitHub Container Registry.
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: The system packages the application using aggressive layer caching and applies a SHA tag.
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/suyeeen/stqm-app:latest
            ghcr.io/suyeeen/stqm-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Phase 3 - Deployment to VPS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    steps:
      - name: The system executes the deployment sequence via SSH.
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: IMAGE_SHA,GH_PAT
          script: |
            cd /var/www/s

            echo "Login ke GHCR..."
            echo "${GH_PAT}" | docker login ghcr.io -u "suyeeen" --password-stdin

            echo "Simpan tag lama untuk rollback..."
            OLD_TAG=$(grep "^IMAGE_TAG=" .env 2>/dev/null | cut -d '=' -f2 || echo "latest")
            grep -q "^OLD_IMAGE_TAG=" .env && \
              sed -i "s|^OLD_IMAGE_TAG=.*|OLD_IMAGE_TAG=${OLD_TAG}|" .env || \
              echo "OLD_IMAGE_TAG=${OLD_TAG}" >> .env

            echo "Update IMAGE_TAG ke versi baru..."
            grep -q "^IMAGE_TAG=" .env && \
              sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${IMAGE_SHA}|" .env || \
              echo "IMAGE_TAG=${IMAGE_SHA}" >> .env

            echo "Pull image terbaru dari GHCR..."
            docker-compose pull app

            echo "Restart container..."
            docker-compose up -d app

            echo "Migrate dan cache..."
            docker-compose exec -T app php artisan migrate --force
            docker-compose exec -T app php artisan config:cache
            docker-compose exec -T app php artisan route:cache
            docker-compose exec -T app php artisan view:cache
            docker-compose exec -T app php artisan storage:link
            docker-compose exec -T -u root app chown -R www-data:www-data /var/www/storage /var/www/bootstrap/cache

            echo "Deploy selesai: $(date)"
        env:
          IMAGE_SHA: ${{ github.sha }}
          GH_PAT: ${{ secrets.GH_PAT }}

  healthcheck:
    name: Phase 4 - Post-Deployment Health Check
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: The system verifies the application status and performs rollback if failure occurs.
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/s
            sleep 20
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.VPS_HOST }}:8080)
            if [ "$STATUS" != "200" ] && [ "$STATUS" != "302" ]; then
              echo "Health check failed! Initiating rollback..."
              OLD_TAG=$(grep "^OLD_IMAGE_TAG=" .env 2>/dev/null | cut -d '=' -f2 || echo "latest")
              sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${OLD_TAG}|" .env
              docker-compose pull app && docker-compose up -d app
              exit 1
            fi
            echo "Health check passed!"

      - name: The system deletes dangling Docker images to free up server storage space.
        if: always()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: docker image prune -f

      - name: The system validates the final container health status after deployment.
        if: always()
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: docker-compose -f /var/www/s/docker-compose.yml ps

  notify:
    name: Phase 5 - Deployment Notification
    runs-on: ubuntu-latest
    needs: [deploy, healthcheck]
    if: always() && github.ref == 'refs/heads/main'
    steps:
      - name: Notify deploy success
        if: needs.deploy.result == 'success' && needs.healthcheck.result == 'success'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            Deploy STQM Berhasil!
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.event.head_commit.message }}
            Image: ghcr.io/suyeeen/stqm-app:${{ github.sha }}
            By: ${{ github.actor }}
            URL: http://${{ secrets.VPS_HOST }}:8080

      - name: Notify deploy failed
        if: needs.deploy.result == 'failure' || needs.healthcheck.result == 'failure'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            Deploy STQM GAGAL!
            Branch: ${{ github.ref_name }}
            Commit: ${{ github.event.head_commit.message }}
            By: ${{ github.actor }}
            Cek: https://github.com/suyeeen/s_STQM/actions